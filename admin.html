<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Wound Care Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f4f7f6; --card: #ffffff; --primary: #10b981; --primary-dark: #047857;
      --text: #1f2937; --muted: #6b7280; --border: #e5e7eb; --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    h1 { font-size: 18px; margin: 0 0 4px 0; color: var(--primary-dark); }
    h2 { font-size: 14px; margin: 22px 0 8px 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    p.subtitle { margin: 0 0 16px 0; color: var(--muted); font-size: 13px; }

    /* PIN gate */
    #pinScreen { max-width: 360px; margin: 60px auto 0; background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); text-align: center; }
    #pinScreen input { width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 4px; border: 1px solid var(--border); border-radius: 8px; margin: 12px 0; }
    #pinScreen button { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
    #pinError { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

    /* Main dashboard */
    #dashboard { display: none; max-width: 560px; margin: 0 auto; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .refresh-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text); }
    .lock-btn { border: none; background: none; color: var(--muted); font-size: 13px; cursor: pointer; text-decoration: underline; }

    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
    .card .name { font-weight: 700; font-size: 15px; }
    .card .booking-id { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .card .row { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; }
    .card .row .label { color: var(--muted); }
    .card a { color: var(--primary-dark); }
    .empty-state { color: var(--muted); font-size: 13px; padding: 8px 0 20px; }

    .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-confirm { background: var(--primary); color: #fff; }
    .btn-decline { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .invoice-form select { width: 100%; padding: 9px 10px; margin: 4px 0 8px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: #fff; }
    .invoice-form label { font-size: 12px; font-weight: 600; color: var(--text); }
    .btn-invoice { width: 100%; background: var(--primary-dark); color: #fff; margin-top: 4px; }

    .toast { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 528px; margin: 0 auto; background: var(--text); color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 10; }
    .toast.error { background: var(--danger); }
  </style>
</head>
<body>

  <div id="pinScreen">
    <h1>Wound Care Admin</h1>
    <p class="subtitle">Enter your admin PIN to continue.</p>
    <input type="password" inputmode="numeric" id="pinInput" placeholder="PIN" autofocus>
    <button onclick="unlock()">Unlock</button>
    <div id="pinError">Incorrect PIN. Please try again.</div>
  </div>

  <div id="dashboard">
    <div class="top-row">
      <h1>Wound Care Admin</h1>
      <button class="lock-btn" onclick="lock()">Lock</button>
    </div>
    <p class="subtitle">Confirm/decline new requests and generate invoices - all from your phone.</p>
    <button class="refresh-btn" onclick="loadBookings()">↻ Refresh</button>

    <h2>Pending Review</h2>
    <div id="pendingList"></div>

    <h2>Confirmed - Awaiting Invoice</h2>
    <div id="confirmedList"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbyNa1KZAipbxc0cT6S9Nkqr85EQQmWeN6RDuAi6Yg_kUxf8575Hk_lx7jQT3AXC4IbT7Q/exec';
    let pin = '';
    let formOptions = null;

    function showToast(message, isError) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast' + (isError ? ' error' : '');
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 3500);
    }

    function apiGet(action, params) {
      const query = new URLSearchParams(Object.assign({ action: action }, params || {}));
      return fetch(BASE_URL + '?' + query.toString()).then(function(res) { return res.json(); })
        .then(function(json) { if (json && json.error) throw new Error(json.error); return json; });
    }

    function apiPost(action, payload) {
      return fetch(BASE_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload }) })
        .then(function(res) { return res.json(); })
        .then(function(json) { if (json && json.error) throw new Error(json.error); return json; });
    }

    function unlock() {
      const entered = document.getElementById('pinInput').value.trim();
      if (!entered) return;
      pin = entered;
      apiPost('adminListBookings', { pin: pin }).then(function(data) {
        document.getElementById('pinScreen').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        localStorage.setItem('woundcare_admin_pin', pin);
        renderBookings(data);
        apiGet('getFormOptions').then(function(opts) { formOptions = opts; });
      }).catch(function(err) {
        document.getElementById('pinError').style.display = 'block';
        document.getElementById('pinError').textContent = err.message;
      });
    }

    function lock() {
      pin = '';
      localStorage.removeItem('woundcare_admin_pin');
      document.getElementById('pinInput').value = '';
      document.getElementById('pinError').style.display = 'none';
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('pinScreen').style.display = 'block';
    }

    function loadBookings() {
      apiPost('adminListBookings', { pin: pin }).then(renderBookings).catch(function(err) {
        showToast(err.message, true);
      });
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function renderBookings(data) {
      renderPending(data.pendingReview || []);
      renderConfirmed(data.confirmedAwaitingInvoice || []);
    }

    function renderPending(list) {
      const container = document.getElementById('pendingList');
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">Nothing waiting for review.</div>';
        return;
      }
      container.innerHTML = list.map(function(b) {
        return (
          '<div class="card">' +
            '<div class="name">' + esc(b.name) + '</div>' +
            '<div class="booking-id">' + esc(b.bookingId) + '</div>' +
            '<div class="row"><span class="label">Date/Time</span><span>' + esc(b.preferredDate) + ' - ' + esc(b.preferredTime) + '</span></div>' +
            '<div class="row"><span class="label">Phone</span><span>' + esc(b.phone) + '</span></div>' +
            '<div class="row"><span class="label">Wound</span><span>' + esc(b.woundType) + '</span></div>' +
            '<div class="row"><span class="label">Est. size/depth/dressing</span><span>' + esc(b.estSize) + ' / ' + esc(b.estDepth) + ' / ' + esc(b.estDressing) + '</span></div>' +
            '<div class="row"><span class="label">Distance</span><span>' + (b.distanceKm ? esc(b.distanceKm) + ' km' : '--') + '</span></div>' +
            (b.distanceScreenshotLink && b.distanceScreenshotLink.indexOf('http') === 0 ? '<div class="row"><span class="label">Distance proof</span><a href="' + esc(b.distanceScreenshotLink) + '" target="_blank">View</a></div>' : '') +
            (b.photoLink && b.photoLink.indexOf('http') === 0 ? '<div class="row"><span class="label">Wound photo</span><a href="' + esc(b.photoLink) + '" target="_blank">View</a></div>' : '') +
            '<div class="row"><span class="label">Estimated total</span><span>RM ' + esc(b.estimatedTotalCost) + '</span></div>' +
            '<div class="btn-row">' +
              '<button class="btn btn-confirm" onclick="confirmBooking(\'' + esc(b.bookingId) + '\', this)">Confirm</button>' +
              '<button class="btn btn-decline" onclick="declineBooking(\'' + esc(b.bookingId) + '\', this)">Decline</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');
    }

    function optionsHtml(items, selectedFallback) {
      let html = '<option value="">Select...</option>';
      (items || []).forEach(function(item) {
        html += '<option value="' + esc(item) + '">' + esc(item) + '</option>';
      });
      return html;
    }

    function renderConfirmed(list) {
      const container = document.getElementById('confirmedList');
      if (!list.length) {
        container.innerHTML = '<div class="empty-state">No confirmed bookings awaiting invoice.</div>';
        return;
      }
      container.innerHTML = list.map(function(b, i) {
        const fid = 'inv_' + i;
        return (
          '<div class="card">' +
            '<div class="name">' + esc(b.name) + '</div>' +
            '<div class="booking-id">' + esc(b.bookingId) + '</div>' +
            '<div class="row"><span class="label">Date/Time</span><span>' + esc(b.preferredDate) + ' - ' + esc(b.preferredTime) + '</span></div>' +
            '<div class="row"><span class="label">Wound</span><span>' + esc(b.woundType) + '</span></div>' +
            '<div class="invoice-form">' +
              '<label>Actual Size</label>' +
              '<select id="' + fid + '_size"></select>' +
              '<label>Actual Depth</label>' +
              '<select id="' + fid + '_depth"></select>' +
              '<label>Actual Dressing Type</label>' +
              '<select id="' + fid + '_dressing"></select>' +
              '<label>Actual Difficulty (optional)</label>' +
              '<select id="' + fid + '_difficulty"></select>' +
              '<button class="btn btn-invoice" onclick="generateInvoice(\'' + esc(b.bookingId) + '\', \'' + fid + '\', this)">Generate Invoice</button>' +
            '</div>' +
          '</div>'
        );
      }).join('');

      // Fill dropdowns once options are ready (fetched in unlock(); fall back to a quick fetch if not ready yet).
      const fillAll = function() {
        list.forEach(function(b, i) {
          const fid = 'inv_' + i;
          document.getElementById(fid + '_size').innerHTML = optionsHtml(formOptions.size);
          document.getElementById(fid + '_depth').innerHTML = optionsHtml(formOptions.depth);
          document.getElementById(fid + '_dressing').innerHTML = optionsHtml(formOptions.dressing);
          document.getElementById(fid + '_difficulty').innerHTML = optionsHtml(formOptions.difficulty);
        });
      };
      if (formOptions) {
        fillAll();
      } else {
        apiGet('getFormOptions').then(function(opts) { formOptions = opts; fillAll(); }).catch(function(err) { showToast(err.message, true); });
      }
    }

    function confirmBooking(bookingId, btn) {
      btn.disabled = true;
      apiPost('adminConfirmBooking', { pin: pin, bookingId: bookingId }).then(function() {
        showToast('Booking confirmed - email sent.');
        loadBookings();
      }).catch(function(err) {
        showToast(err.message, true);
        btn.disabled = false;
      });
    }

    function declineBooking(bookingId, btn) {
      if (!confirm('Decline this booking? This cannot be undone.')) return;
      btn.disabled = true;
      apiPost('adminDeclineBooking', { pin: pin, bookingId: bookingId }).then(function() {
        showToast('Booking declined - email sent.');
        loadBookings();
      }).catch(function(err) {
        showToast(err.message, true);
        btn.disabled = false;
      });
    }

    function generateInvoice(bookingId, fid, btn) {
      const actualSize = document.getElementById(fid + '_size').value;
      const actualDepth = document.getElementById(fid + '_depth').value;
      const actualDressing = document.getElementById(fid + '_dressing').value;
      const actualDifficulty = document.getElementById(fid + '_difficulty').value;

      if (!actualSize || !actualDepth || !actualDressing) {
        showToast('Please select Size, Depth, and Dressing Type first.', true);
        return;
      }
      btn.disabled = true;
      apiPost('adminGenerateInvoice', {
        pin: pin, bookingId: bookingId,
        actualSize: actualSize, actualDepth: actualDepth,
        actualDressing: actualDressing, actualDifficulty: actualDifficulty
      }).then(function(result) {
        showToast('Invoice generated - RM ' + result.finalCost + ' emailed to client.');
        loadBookings();
      }).catch(function(err) {
        showToast(err.message, true);
        btn.disabled = false;
      });
    }

    // Auto-unlock if a PIN was remembered from a previous visit (still verified server-side every request).
    (function() {
      const saved = localStorage.getItem('woundcare_admin_pin');
      if (saved) {
        document.getElementById('pinInput').value = saved;
        unlock();
      }
    })();

    document.getElementById('pinInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') unlock();
    });
  </script>
</body>
</html>
